name: Catalog addition
description: Suggest adding a plugin/repo to the search_plugins catalog
title: "catalog: "
labels: [catalog]
body:
  - type: input
    id: repo
    attributes:
      label: Repository (owner/name)
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install command (if verified)
  - type: textarea
    id: desc
    attributes:
      label: One-line description and tags
