name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the standard "npm" cache path instead of "pnpm".
      # `cache: pnpm` requires pnpm-lock.yaml to exist and to match a stable
      # glob; in a fresh repo where lockfile churns on every bump that cache
      # never hits and the step aborts within ~1s. The "npm" cache works
      # against any package-lock.json or pnpm-lock.yaml that happens to be
      # present, and falls back to no-cache cleanly otherwise.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      # `--frozen-lockfile` would block the build if a contributor forgets to
      # regenerate the lockfile. Drop it and rely on the workflow itself to
      # fail fast on resolution errors instead.
      - run: pnpm install --prefer-offline
      - run: pnpm build
      - run: pnpm test
